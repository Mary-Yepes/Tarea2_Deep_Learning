# =====================================================================================
# PRE-REGISTRO — Protocolo experimental transversal (sección 4.8.22)
# Congelar con:  git add configs/prereg.yaml && git commit -m "prereg" && git tag prereg
# ANTES de entrenar cualquier modelo final. Toda desviación posterior se registra en
# `desviaciones` (abajo) y se declara en el reporte (book/metodos.md).
# =====================================================================================
version: 1.0
fecha_congelamiento: null          # se completa al crear la etiqueta git `prereg`
autor: null

hipotesis:
  H1:
    enunciado: >
      Los modelos con preentrenamiento (Mask R-CNN+Swin COCO/ImageNet, Cellpose ajustado, SAM con
      ajuste fino del decodificador) superan a U-Net++ entrenada desde cero cuando se usa <= 25 % del
      train, y la brecha se reduce con el 100 %.
    contraste: >
      Δ25 = AP(mejor preentrenado) − AP(U-Net++ desde cero) por imagen de test, con 25 % del train;
      Δ100 igual con 100 %. ≥ 3 semillas por modelo; se promedian las semillas por imagen.
    prueba: "Wilcoxon pareado por imagen + IC 95 % bootstrap jerárquico (sample_id → imagen, 10 000)"
    refutacion: >
      Se REFUTA si el IC 95 % de Δ25 incluye 0, o si el IC 95 % de (Δ25 − Δ100) incluye 0 o es negativo
      (la brecha no se reduce).
    rq: RQ2
  H2:
    enunciado: >
      AUC-ROC y balanced accuracy de píxel saturan (> 0.95) sin discriminar entre los modelos de deep
      learning, mientras que AP@[0.5:0.95] sí los discrimina.
    contraste: >
      Ranking de los 5 modelos de DL por AUC de píxel (media por imagen) vs ranking por AP.
      Saturación := todas las medias de AUC > 0.95 y rango (máx − mín) < 0.02.
    prueba: "Spearman ρ entre rankings con IC bootstrap sobre imágenes; Friedman sobre AUC"
    refutacion: "Se REFUTA si ρ(rank_AUC, rank_AP) > 0.9 o si alguna media de AUC <= 0.95."
    rq: RQ3
  H3:
    enunciado: "El ranking global de modelos cambia al estratificar por tipo celular (paradoja de Simpson)."
    contraste: "Orden de los 6 modelos por AP medio en test global y dentro de shsy5y, astro y cort."
    prueba: "Friedman + Wilcoxon–Holm dentro de cada tipo; τ de Kendall entre órdenes"
    refutacion: "Se REFUTA si el orden es idéntico en los tres tipos celulares."
    rq: RQ1
  H4:
    enunciado: >
      (Hipótesis nula a contrastar explícitamente) La diferencia de F1 macro entre el mejor transformer
      y TF-IDF + XGBoost NO es estadísticamente significativa tras corregir por comparaciones múltiples y
      varianza entre semillas.
    contraste: "ΔF1 = F1(transformer) − F1(TF-IDF+XGBoost) emparejados por semilla×fold (3 semillas del transformer × 5 folds = 15 pares)"
    prueba: >
      t remuestreada corregida de Nadeau–Bengio (25 repeticiones) con Holm dentro de la familia NLP;
      equivalencia práctica por TOST con δ_NLP; McNemar exacto en test sellado como confirmación.
    refutacion: >
      H4 se REFUTA si p_Holm < 0.05 y el IC 95 % de ΔF1 está completamente por encima de δ_NLP.
      Se considera APOYADA si el IC 95 % de ΔF1 cae dentro de [−δ_NLP, δ_NLP] (TOST). Otro caso:
      no concluyente (se reporta como tal).
    rq: RQ5
  H5:
    enunciado: >
      El fine-tuning del transformer empeora la calibración (ECE) respecto a TF-IDF + LR, y el
      temperature scaling (ajustado en validación) la recupera sin alterar la exactitud.
    contraste: "ECE (15 bins, top-label) en test: transformer T=1, transformer T*, TF-IDF+LR"
    prueba: "IC 95 % bootstrap pareado (por ejemplo) de las diferencias de ECE; exactitud idéntica por construcción"
    refutacion: >
      Se REFUTA la primera parte si el IC 95 % de ECE(transformer, T=1) − ECE(TF-IDF+LR) incluye 0 o es
      negativo; la segunda parte si ECE(T*) no baja al menos 50 % respecto de ECE(T=1) o si
      |ECE(T*) − ECE(TF-IDF+LR)| > δ_ECE.
    rq: RQ7
  H6:
    enunciado: >
      El monitor de deriva (PSI + KS + χ² por ventana de 200 textos o 50 imágenes) detecta deriva de severidad >= 2
      con poder >= 0.8 y una tasa de falsas alarmas <= 5 % por ventana sin deriva.
    contraste: "Simulación con 200 réplicas por severidad (0–5) y tipo de deriva"
    prueba: "Proporciones con IC de Wilson"
    refutacion: "Se REFUTA si el IC 95 % del poder a severidad 2 queda por debajo de 0.8 o el de la FPR por encima de 0.05."
    rq: RQ8

metrica_primaria:
  imagenes: "AP@[0.5:0.95] estilo Sartorius (media sobre umbrales de IoU de TP/(TP+FP+FN), por imagen)"
  nlp: "F1 macro (salvo que el EDA justifique otra; cualquier cambio se registra como desviación)"

metricas_secundarias:
  imagenes: [AP50, AP75, PQ, SQ, RQ, AJI, precision_instancia, recall_instancia, F1_instancia,
             MAE_conteo, RMSE_conteo, pearson_conteo, bland_altman, Dice, IoU, precision_pixel,
             recall_pixel, HD95, F1_borde, AUC_ROC_pixel, AUC_PR_pixel, balanced_accuracy_pixel,
             ECE_pixel, latencia_p50, latencia_p95]
  nlp: [accuracy, precision_macro, recall_macro, F1_micro, F1_ponderado, MCC, balanced_accuracy,
        ROC_AUC_OvR, PR_AUC_OvR, log_loss, Brier, ECE, latencia_p50, latencia_p95]

unidad_de_analisis:
  imagenes: "imagen (todas las métricas se calculan por imagen y se agregan con IC bootstrap)"
  nlp: "ejemplo (McNemar, bootstrap en test) y par semilla×fold (t corregida)"

particiones:
  segmentacion: >
    70/15/15 (train/val/test) por grupo sample_id con StratifiedGroupKFold estratificado por tipo
    celular (semilla 42); test sellado evaluado una sola vez por modelo final; 5-fold agrupado de la
    mejor configuración para estimar varianza.
  nlp: >
    Antes de dividir: eliminación de duplicados exactos y agrupación de casi-duplicados (MinHash/LSH,
    Jaccard de 5-gramas de caracteres >= 0.8) como grupos; 70/15/15 estratificado por clase y agrupado
    por clúster; si hay estructura temporal o por autor se usa partición temporal/por grupo (se
    declara). Test sellado 15 %.
  ajustes_solo_con_train: [TF-IDF, vocabulario, tokenizer propio, Word2Vec/FastText desde cero, estadísticos de normalización]
  ajustes_solo_con_validacion: [umbrales de decisión, temperatura, parámetros de watershed/NMS, early stopping]
  validacion_anidada: "completa para modelos ligeros (XGBoost, FastText, CNN-1D, BiLSTM, baselines)"
  modelos_pesados: "HPO en un único split de validación + 5-fold con configuración fija (sesgo optimista declarado)"

pruebas_estadisticas:
  alpha: 0.05
  correccion: holm
  dos_modelos_segmentacion: "Wilcoxon pareado por imagen"
  dos_modelos_nlp: "McNemar exacto (test) y t remuestreada corregida de Nadeau–Bengio (repeticiones)"
  tres_o_mas_modelos: "Friedman + Wilcoxon por pares con Holm + diagrama de diferencia crítica (Nemenyi)"
  intervalos: "bootstrap BCa sobre unidades de análisis, 10 000 remuestreos; jerárquico por sample_id en segmentación"
  tamanos_de_efecto: [d_de_Cohen_pareado, delta_de_Cliff]
  estructura_jerarquica: "statsmodels.mixedlm(score ~ C(modelo), groups=sample_id)"
  bayesiano_opcional: "rangos con signo bayesiano con ROPE = δ"

efecto_minimo_relevante:
  imagenes_AP: 0.02
  justificacion_imagenes: >
    0.02 de AP equivale aproximadamente a cambiar la clasificación correcta de ~2 de cada 100 células en
    el rango de umbrales medios y supera la variabilidad típica entre semillas observada en pilotos
    (DE ≈ 0.005–0.01); diferencias menores no alteran el conteo celular de forma relevante para el uso.
  nlp_F1: 0.02
  justificacion_nlp: >
    En selección de personal una mejora de 2 puntos de F1 macro altera la decisión sobre ~2 de cada 100
    candidatos; por debajo de ello domina el ruido de etiquetas estimado en la auditoría.
  ECE: 0.01

semillas:
  modelos_ligeros: [0, 1, 2, 3, 4]
  modelos_pesados: [0, 1, 2]
  transformer: [0, 1, 2]
  sampler_hpo: 0

presupuesto:
  perfil: urgente                   # perfil de configs/budget.yaml usado en la corrida confirmatoria
  n_trials_hpo:
    segmentacion_pesados: 0         # IGUAL para los 5 modelos pesados: configuración fija tomada de la
                                    # literatura/EDA + ajuste del post-procesamiento en validación (rejilla pequeña)
    nlp_modelos_comparables: 15     # IGUAL para TF-IDF+LR, TF-IDF+XGBoost, FastText, CNN-1D y BiLSTM (TPE + poda)
    transformer: 0                  # receta estándar (lr 3e-5, warmup 10 %, LLRD 0.9); declarado como sesgo a su favor/en contra
  horas_gpu_por_modelo:
    segmentacion_pesados: "≈ 0.3–0.6 por semilla (máximo de épocas fijo: 35 Keras, 12 Mask R-CNN; tope de 0.6 h en Mask R-CNN)"
    nlp_transformer: "≈ 3 épocas por ajuste"
  modelos_ligeros: "CPU/GPU; 15 trials"
  justificacion: >
    Plazo de entrega corto y GPU gratuita limitada (Kaggle, ≈ 30 h/semana). Se prioriza cumplir el protocolo
    (≥ 3 semillas en pesados, ≥ 5 en ligeros, particiones sin fuga, test sellado, inferencia estadística) frente
    a la búsqueda de hiperparámetros. Consecuencia declarada: los modelos pesados pueden estar sub-optimizados
    por igual; las diferencias entre paradigmas se interpretan como «con configuración estándar».
  hardware_declarado: null          # se completa en el reporte de reproducibilidad

criterios_de_parada:
  segmentacion: "early stopping sobre pérdida de validación, paciencia 7 épocas, máximo 35 (Keras); Mask R-CNN: AP de validación, paciencia 3, máximo 12"
  nlp_keras: "early stopping sobre pérdida de validación, paciencia 3 épocas, máximo 20"
  transformer: "paciencia 2 épocas, máximo 3"
  xgboost: "early_stopping_rounds = 30 sobre validación"

reglas_de_reporte:
  - "Toda cifra como media [IC 95 %]."
  - "Figuras cualitativas: muestra aleatoria con semilla fija + 5 mejores y 5 peores por métrica."
  - "Toda métrica con su definición exacta y la implementación usada (src/project)."
  - "Resultados negativos y refutaciones se reportan con el mismo detalle."

desviaciones:   # decididas ANTES de entrenar y de ver resultados
  - fecha: "2026-10-19"
    seccion: presupuesto
    descripcion: >
      Se usa el perfil `urgente` (configs/budget.yaml) en lugar de `rapido`: 1 semilla en segmentación
      (en vez de 3), 12 épocas U-Net++/Hover-Net, 4 Mask R-CNN, 30 Cellpose; fracciones {0.25, 1.0};
      ablaciones reducidas (pérdida, codificador, aumento) con 6 épocas; NLP con 3 semillas, 5 trials de
      HPO y transformer de 2 épocas con 1 semilla.
    motivo: plazo de entrega de un día
    impacto_esperado: >
      Modelos pesados posiblemente sub-entrenados (sesgo en contra de los más lentos, p. ej. Mask R-CNN);
      sin variabilidad entre semillas en segmentación; menor potencia en H1 y ablaciones. Resultados preliminares.
# formato: [{fecha, seccion, descripcion, motivo, impacto_esperado}]
# [{fecha, seccion, descripcion, motivo, impacto_esperado}]
