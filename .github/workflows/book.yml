name: Libro (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar Jupyter Book
        run: pip install "jupyter-book>=1,<2" matplotlib pandas numpy
      - name: Construir el libro (los notebooks ya vienen ejecutados)
        run: jupyter-book build book
      - uses: actions/upload-pages-artifact@v3
        with: { path: book/_build/html }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
